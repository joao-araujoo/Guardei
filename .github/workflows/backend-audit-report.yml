name: Backend Audit Report

on:
  push:
    branches:
      - feat/guardei-everywhere-v3

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/guardei-everywhere-v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix server --ignore-scripts

      - name: Capture audit report
        shell: bash
        run: |
          npm audit --prefix server --json > server/backend-audit-report.json || true

      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/backend-audit-report.json
          git commit -m "chore: capture backend audit report"
          git push origin HEAD:feat/guardei-everywhere-v3
