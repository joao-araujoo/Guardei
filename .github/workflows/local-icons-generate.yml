name: Local Icons Generate

on:
  push:
    branches:
      - fix/local-lucide-runtime

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-lucide-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: node scripts/generate-local-icons.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit generated catalog
        run: |
          if git diff --quiet -- src/lib/localIconify.js; then
            echo "Local icon catalog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/localIconify.js
          git commit -m "chore: generate local Lucide catalog"
          git push origin HEAD:fix/local-lucide-runtime
