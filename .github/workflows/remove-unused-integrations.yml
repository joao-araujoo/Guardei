name: Remove unused integration scaffolding

on:
  push:
    branches:
      - feat/product-completion-sprint

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://guardei:guardei@localhost:5432/guardei
      DATABASE_DIRECT_URL: postgresql://guardei:guardei@localhost:5432/guardei
      AUTH_SECRET: guardei-final-cleanup-ci-secret-long-enough
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-completion-sprint
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply schema and documentation cleanup
        run: python scripts/remove_unused_integrations.py

      - name: Install clean dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix server --no-audit --no-fund

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix server --audit-level=high

      - name: Validate Prisma schema and client
        run: |
          npx --prefix server prisma validate
          npm --prefix server run db:generate

      - name: Check backend syntax
        run: find server/src server/scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run all tests
        run: |
          npm test
          npm --prefix server test

      - name: Build production frontend
        run: npm run build

      - name: Commit validated cleanup
        run: |
          rm .github/workflows/remove-unused-integrations.yml scripts/remove_unused_integrations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove unused integration scaffolding"
          git push origin HEAD:feat/product-completion-sprint
