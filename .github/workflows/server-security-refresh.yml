name: Server Security Refresh

on:
  push:
    branches:
      - feat/guardei-everywhere-v3

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/guardei
      DATABASE_DIRECT_URL: postgresql://user:password@localhost:5432/guardei
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/guardei-everywhere-v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Regenerate backend lockfile
        run: npm install --prefix server --package-lock-only --ignore-scripts

      - name: Verify clean backend install
        run: npm ci --prefix server --ignore-scripts

      - name: Audit all backend dependencies
        run: npm audit --prefix server --audit-level=low

      - name: Generate Prisma client
        run: npm --prefix server run db:generate

      - name: Check backend syntax
        shell: bash
        run: find server/src server/scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run backend tests
        run: npm --prefix server test

      - name: Commit secure backend lockfile
        shell: bash
        run: |
          if git diff --quiet -- server/package-lock.json; then
            echo "Backend lockfile already synchronized and secure."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git commit -m "fix: refresh secure backend dependency lock"
          git push origin HEAD:feat/guardei-everywhere-v3
