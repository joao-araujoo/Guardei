name: Knowledge Cycle Source Snapshot

on:
  push:
    branches:
      - feat/knowledge-cycle

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: guardei-knowledge-cycle-source-${{ github.sha }}
          path: |
            .
            !.git
            !node_modules
            !server/node_modules
            !dist
          include-hidden-files: true
          retention-days: 1
