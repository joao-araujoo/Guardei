name: Guardei CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm install --prefix server

      - name: Generate Prisma client
        run: npm --prefix server run db:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/guardei
          DATABASE_DIRECT_URL: postgresql://user:password@localhost:5432/guardei

      - name: Check backend syntax
        run: find server/src server/scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run frontend product tests
        run: npm test

      - name: Run backend knowledge tests
        run: npm --prefix server test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://user:password@localhost:5432/guardei
          DATABASE_DIRECT_URL: postgresql://user:password@localhost:5432/guardei
          AUTH_SECRET: ci-secret-with-at-least-thirty-two-characters

      - name: Build frontend
        run: npm run build
