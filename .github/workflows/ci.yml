name: Guardei CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: guardei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d guardei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://user:password@localhost:5432/guardei
      DATABASE_DIRECT_URL: postgresql://user:password@localhost:5432/guardei
      AUTH_SECRET: ci-secret-with-at-least-thirty-two-characters
      NPM_CONFIG_FETCH_RETRIES: 3
      NPM_CONFIG_FETCH_TIMEOUT: 60000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure public npm registry lockfiles
        shell: bash
        run: |
          if grep -R 'packages.applied-caas-gateway1.internal.api.openai.org' package-lock.json server/package-lock.json; then
            echo 'Internal registry URL found in a committed lockfile.'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Install backend dependencies
        run: npm ci --prefix server --no-audit --no-fund

      - name: Audit backend dependencies
        run: npm audit --prefix server --audit-level=high

      - name: Validate fresh-database Prisma migrations
        working-directory: server
        run: |
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status
          npm run db:generate

      - name: Validate legacy adoption with empty migration history
        working-directory: server
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          const prisma = new PrismaClient();
          try {
            await prisma.$executeRawUnsafe('TRUNCATE TABLE "_prisma_migrations"');
          } finally {
            await prisma.$disconnect();
          }
          NODE
          npm run db:migrate:production
          npx prisma migrate status

      - name: Validate legacy adoption with missing migration history
        working-directory: server
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          const prisma = new PrismaClient();
          try {
            await prisma.$executeRawUnsafe('DROP TABLE IF EXISTS "_prisma_migrations" CASCADE');
          } finally {
            await prisma.$disconnect();
          }
          NODE
          npm run db:migrate:production
          npx prisma migrate status

      - name: Check backend syntax
        shell: bash
        run: find server/src server/scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate backend initialization
        run: node -e "import('./server/src/index.js').then(() => console.log('Backend initialized successfully'))"

      - name: Run frontend product tests
        run: npm test

      - name: Run backend knowledge tests
        run: npm --prefix server test

      - name: Build frontend
        run: npm run build
