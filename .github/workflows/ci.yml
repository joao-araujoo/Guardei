name: Guardei CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://user:password@localhost:5432/guardei
      DATABASE_DIRECT_URL: postgresql://user:password@localhost:5432/guardei
      AUTH_SECRET: ci-secret-with-at-least-thirty-two-characters
      NPM_CONFIG_FETCH_RETRIES: 3
      NPM_CONFIG_FETCH_TIMEOUT: 60000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure public npm registry lockfiles
        shell: bash
        run: |
          if grep -R 'packages.applied-caas-gateway1.internal.api.openai.org' package-lock.json server/package-lock.json; then
            echo 'Internal registry URL found in a committed lockfile.'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Install backend dependencies
        run: npm ci --prefix server --no-audit --no-fund

      - name: Audit backend dependencies
        run: npm audit --prefix server --audit-level=high

      - name: Generate Prisma client
        run: npm --prefix server run db:generate

      - name: Check backend syntax
        shell: bash
        run: find server/src server/scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate backend initialization
        run: node -e "import('./server/src/index.js').then(() => console.log('Backend initialized successfully'))"

      - name: Run frontend product tests
        run: npm test

      - name: Run backend knowledge tests
        run: npm --prefix server test

      - name: Build frontend
        run: npm run build
