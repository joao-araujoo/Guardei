name: Refresh production lockfiles

on:
  push:
    branches: [fix/production-hardening-v1]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-hardening-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Regenerate lockfiles from pinned manifests
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix server --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean installs and dependency audits
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix server --no-audit --no-fund
          npm audit --audit-level=high
          npm audit --prefix server --audit-level=high

      - name: Commit refreshed locks and remove maintenance workflow
        run: |
          rm .github/workflows/refresh-production-locks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json .github/workflows/refresh-production-locks.yml
          git commit -m "chore: refresh pinned production lockfiles"
          git push origin HEAD:fix/production-hardening-v1
