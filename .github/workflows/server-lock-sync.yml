name: Server Lockfile Sync

on:
  push:
    branches:
      - feat/guardei-everywhere-v3

permissions:
  contents: write

jobs:
  sync-server-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/guardei-everywhere-v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Regenerate backend lockfile
        run: npm install --prefix server --package-lock-only --ignore-scripts

      - name: Verify clean backend install
        run: npm ci --prefix server --ignore-scripts

      - name: Commit backend lockfile
        shell: bash
        run: |
          if git diff --quiet -- server/package-lock.json; then
            echo "Backend lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git commit -m "fix: synchronize backend package lock"
          git push origin HEAD:feat/guardei-everywhere-v3
