name: Semantic Evolution Source Snapshot

on:
  push:
    branches:
      - feat/semantic-search-learning-paths
  pull_request:
    branches:
      - feat/intelligent-capsules

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: guardei-semantic-source-${{ github.sha }}
          path: |
            .
            !.git
            !node_modules
            !server/node_modules
            !dist
          include-hidden-files: true
          retention-days: 1
