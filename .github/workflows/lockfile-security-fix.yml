name: Lockfile Security Fix

on:
  push:
    branches:
      - feat/guardei-everywhere-v3

permissions:
  contents: write

jobs:
  refresh-frontend-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/guardei-everywhere-v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh frontend lockfile
        run: npm audit fix --package-lock-only --audit-level=high

      - name: Verify frontend audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed frontend lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Frontend lockfile already secure."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh frontend lockfile for security advisory"
          git push origin HEAD:feat/guardei-everywhere-v3
