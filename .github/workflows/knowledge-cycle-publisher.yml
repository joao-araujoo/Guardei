name: Knowledge Cycle Publisher

on:
  pull_request:
    branches:
      - feat/semantic-search-learning-paths

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/knowledge-cycle
          fetch-depth: 1
          show-progress: false
      - name: Hash uploaded parts
        shell: bash
        run: sha256sum .github/knowledge-cycle-patch-parts/part-* && cat .github/knowledge-cycle-patch-parts/part-* | sha256sum
