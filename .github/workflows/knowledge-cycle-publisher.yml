name: Knowledge Cycle Publisher

on:
  pull_request:
    branches:
      - feat/semantic-search-learning-paths

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/knowledge-cycle
          fetch-depth: 0
      - name: Verify and apply knowledge cycle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/knowledge-cycle-patch-parts/part-* > /tmp/knowledge-cycle.patch.gz.b64
          encoded_hash="$(sha256sum /tmp/knowledge-cycle.patch.gz.b64 | cut -d' ' -f1)"
          test "$encoded_hash" = "b6497c2a0e0071e01a89722582df21be0b68ed62f6e2591acfa12ba587f53b7b"
          base64 --decode /tmp/knowledge-cycle.patch.gz.b64 | gzip --decompress > /tmp/knowledge-cycle.patch
          patch_hash="$(sha256sum /tmp/knowledge-cycle.patch | cut -d' ' -f1)"
          test "$patch_hash" = "371d47cf9f3cb3e9772b60f5bb7c223a9123d810155df6bfd4cd88c060bfe650"
          git apply --check /tmp/knowledge-cycle.patch
          git apply /tmp/knowledge-cycle.patch
          rm -rf .github/knowledge-cycle-patch-parts
          rm -f .github/knowledge-cycle-patch-ready
          rm -f .github/workflows/knowledge-cycle-publisher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement knowledge cycle"
          git push origin HEAD:feat/knowledge-cycle
