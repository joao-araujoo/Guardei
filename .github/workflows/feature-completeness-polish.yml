name: Feature completeness polish

on:
  push:
    branches:
      - feat/product-completion-sprint

permissions:
  contents: write

jobs:
  polish-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://guardei:guardei@localhost:5432/guardei
      DATABASE_DIRECT_URL: postgresql://guardei:guardei@localhost:5432/guardei
      AUTH_SECRET: guardei-feature-completeness-ci-secret-long-enough
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-completion-sprint
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Apply feature-completeness patch
        run: python scripts/feature_completeness_patch.py

      - name: Install clean dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix server --no-audit --no-fund

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix server --audit-level=high

      - name: Generate Prisma client
        run: npm --prefix server run db:generate

      - name: Check backend syntax
        run: find server/src server/scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        run: npm --prefix server test

      - name: Build production frontend
        run: npm run build

      - name: Commit validated feature-completeness polish
        run: |
          rm .github/workflows/feature-completeness-polish.yml scripts/feature_completeness_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete remaining Guardei product flows"
          git push origin HEAD:feat/product-completion-sprint
