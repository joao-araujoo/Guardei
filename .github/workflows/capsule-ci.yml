name: Intelligent Capsule CI

on:
  push:
    branches:
      - feat/intelligent-capsules
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-staged-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intelligent-capsules
          fetch-depth: 0
          show-progress: false
      - run: bash .github/patch-publish.sh
