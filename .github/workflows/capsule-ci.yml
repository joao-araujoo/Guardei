name: Intelligent Capsule CI

on:
  push:
    branches:
      - feat/intelligent-capsules
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guardei_test
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/guardei_test
      NODE_ENV: test

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/intelligent-capsules
          fetch-depth: 0

      - name: Apply staged implementation when present
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/capsule-patch-ready ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat .github/capsule-patch-parts/part-* | base64 --decode | gzip --decompress > /tmp/capsule-changes.patch
          git show 12b996f96fc845d68c701e31f642ff3fb766b1c8:.github/workflows/capsule-ci.yml > .github/workflows/capsule-ci.yml
          git apply --check /tmp/capsule-changes.patch
          git apply /tmp/capsule-changes.patch
          rm -rf .github/capsule-patch-parts
          rm -f .github/capsule-patch-ready
          rm -f .github/workflows/apply-capsule-patch.yml
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Audit backend dependencies
        run: npm audit --prefix server --audit-level=high

      - name: Generate Prisma client
        run: npm --prefix server run db:generate

      - name: Validate backend initialization
        run: node --input-type=module -e "import('./server/src/index.js').then(() => process.exit(0))"

      - name: Run backend tests
        run: npm --prefix server test

      - name: Publish validated implementation
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement intelligent content capsules"
          git push origin HEAD:feat/intelligent-capsules
