<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Guardei</title><style>body{margin:0;background:#f5ecd8;color:#2b241d;font:14px/1.5 system-ui,sans-serif}main{width:min(620px,calc(100% - 28px));margin:40px auto;padding:24px;border:2px solid #2b241d;border-radius:18px;background:#fffaf1;box-shadow:7px 7px 0 rgba(43,36,29,.15)}h1{margin-top:0}label{display:grid;gap:5px;margin:14px 0;font-weight:700}input[type=text],input[type=password]{width:100%;padding:11px;border:2px solid #b99868;border-radius:11px;background:#fff}small,p{color:#725f4e}button{min-height:42px;padding:9px 14px;border:2px solid #2b241d;border-radius:11px;background:#2f8f5b;color:#fffaf1;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 #2b241d}.row{display:flex;align-items:center;gap:8px;margin:14px 0}#status{font-weight:800}</style></head><body><main><h1>Conectar extensão ao Guardei</h1><p>No Guardei, abra <strong>Guardar → Mais → Extensão 1 clique</strong>, gere um token e cole abaixo. O token serve somente para captura e pode ser revogado a qualquer momento.</p><label>URL do seu Guardei<input id="apiBase" type="text" placeholder="https://seu-guardei.com"></label><label>Token de captura<input id="captureToken" type="password" placeholder="gcp_..."></label><label class="row"><input id="contextAssist" type="checkbox">Avisar quando eu já tiver algo relacionado à página atual</label><button id="save">Salvar configuração</button><p id="status" role="status"></p></main><script src="options.js"></script></body></html>
